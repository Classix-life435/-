<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- リファラを送りすぎない（外部リンク先に閲覧元の詳細を渡さない） -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>ただの星座占い</title>
  <meta name="description" content="お誕生日を入れるだけで、あなたの星座カードを1枚お届けします。" />

  <!-- OGP（SNSシェア時の見え方） -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ただの星座占い" />
  <meta property="og:description" content="お誕生日を入れるだけで、あなたの星座カードを1枚お届けします。" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="app">
    <!-- ============ 入力画面 ============ -->
    <section id="screen-input" class="screen is-active">
      <header class="hero">
        <p class="hero__moon">🌙</p>
        <h1 class="hero__title">ただの星座占い</h1>
        <p class="hero__sub">あなたの星座カードを、1枚お届けします。</p>
      </header>

      <form id="birth-form" class="card-panel" novalidate>
        <label class="field-label" for="birth-date">お誕生日を選んでください</label>
        <div class="date-row">
          <input type="date" id="birth-date" name="birth-date"
                 min="1900-01-01" max="2026-12-31" required />
        </div>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary" id="divine-btn">
          <span>占う</span>
        </button>
        <p class="note">※ この占いは、お一人さま一度だけお楽しみいただけます。</p>
      </form>
    </section>

    <!-- ============ 結果画面 ============ -->
    <section id="screen-result" class="screen">
      <div class="result-stage">
        <p class="result-lead">あなたの星座は…</p>
        <figure class="result-card" id="result-card">
          <img id="result-img" class="result-card__img" alt="" />
        </figure>
        <h2 class="result-name">
          <span id="result-jp"></span>
          <small id="result-en"></small>
        </h2>
        <p class="result-catch" id="result-catch"></p>
      </div>

      <!-- SNSシェア -->
      <div class="share">
        <p class="share__label">結果をシェアする</p>
        <div class="share__btns">
          <a href="#" id="share-x" class="sns sns--x" target="_blank" rel="noopener" aria-label="Xでシェア">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644Z"/></svg>
          </a>
          <a href="#" id="share-ig" class="sns sns--ig" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16Zm0 1.62c-3.15 0-3.5.01-4.74.07-1.14.05-1.76.24-2.17.4-.55.21-.94.47-1.35.88-.41.41-.67.8-.88 1.35-.16.41-.35 1.03-.4 2.17-.06 1.24-.07 1.59-.07 4.74s.01 3.5.07 4.74c.05 1.14.24 1.76.4 2.17.21.55.47.94.88 1.35.41.41.8.67 1.35.88.41.16 1.03.35 2.17.4 1.24.06 1.59.07 4.74.07s3.5-.01 4.74-.07c1.14-.05 1.76-.24 2.17-.4.55-.21.94-.47 1.35-.88.41-.41.67-.8.88-1.35.16-.41.35-1.03.4-2.17.06-1.24.07-1.59.07-4.74s-.01-3.5-.07-4.74c-.05-1.14-.24-1.76-.4-2.17a3.6 3.6 0 0 0-.88-1.35 3.6 3.6 0 0 0-1.35-.88c-.41-.16-1.03-.35-2.17-.4-1.24-.06-1.59-.07-4.74-.07Zm0 2.76a5.3 5.3 0 1 1 0 10.6 5.3 5.3 0 0 1 0-10.6Zm0 1.62a3.68 3.68 0 1 0 0 7.36 3.68 3.68 0 0 0 0-7.36Zm5.5-2.92a1.24 1.24 0 1 1 0 2.48 1.24 1.24 0 0 1 0-2.48Z"/></svg>
          </a>
          <button type="button" id="share-copy" class="sns sns--copy" aria-label="リンクをコピー">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7h-4a5 5 0 0 0 0 10h4v-1.9h-4A3.1 3.1 0 0 1 3.9 12Zm4.6 1h7v-2h-7v2Zm4.5-6h4a5 5 0 0 1 0 10h-4v-1.9h4a3.1 3.1 0 0 0 0-6.2h-4V7Z"/></svg>
          </button>
        </div>
        <p class="share__copied" id="copied-toast" hidden>リンクをコピーしました</p>
      </div>

      <!-- LINE登録 -->
      <div class="line-cta">
        <a href="#" id="line-add" class="btn btn--line" target="_blank" rel="noopener">
          <svg class="line-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2C6.48 2 2 5.69 2 10.23c0 4.07 3.55 7.48 8.35 8.12.32.07.77.21.88.49.1.25.07.64.03.89l-.14.85c-.04.25-.2.99.87.54 1.06-.45 5.73-3.37 7.82-5.77 1.44-1.58 2.13-3.18 2.13-5.12C21.86 5.69 17.38 2 12 2Z"/></svg>
          <span>LINEで友だち追加</span>
        </a>
        <p class="line-cta__note">登録すると、もっと深い鑑定や日々のメッセージが届きます。</p>
      </div>
    </section>

    <!-- ============ すでに利用済みの画面 ============ -->
    <section id="screen-used" class="screen">
      <div class="card-panel used-panel">
        <p class="hero__moon">🌙</p>
        <h2 class="used-title">この占いは利用済みです</h2>
        <p class="used-text">この占いは、お一人さま一度だけお楽しみいただけます。<br />前回のあなたの星座カードはこちらです。</p>
        <button type="button" class="btn btn--ghost" id="show-saved-btn">前回の結果を見る</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__privacy">入力したお誕生日は、この端末（ブラウザ）の中だけで星座の判定に使われ、サーバーには送信・保存されません。</p>
    <small>© 2026 ただの星座占い</small>
  </footer>

  <script src="js/config.js?v=3"></script>
  <script src="js/zodiac-data.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
