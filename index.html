<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1f">
<title>月の占い 〜あなたの本当の心〜</title>
<style>
  :root{
    --gold:#e7c873;
    --gold-soft:#f3e2af;
    --ink:#0a0a1f;
    --ink2:#12122e;
    --text:#eae6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  html,body{height:100%}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:radial-gradient(ellipse at 50% -10%,#1c1c44 0%,var(--ink2) 45%,var(--ink) 100%);
    background-attachment:fixed;
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  /* 星空 */
  #stars,#stars2{
    position:fixed;inset:0;pointer-events:none;z-index:0;
  }
  .star{
    position:absolute;border-radius:50%;background:#fff;
    animation:twinkle var(--dur,4s) ease-in-out infinite;
    opacity:.6;
  }
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.2)}}

  .wrap{
    position:relative;z-index:2;
    max-width:680px;margin:0 auto;
    padding:48px 22px 80px;
    text-align:center;
  }
  h1{
    font-size:clamp(26px,6vw,40px);
    letter-spacing:.18em;
    font-weight:400;
    margin-bottom:6px;
    text-shadow:0 0 18px rgba(231,200,115,.55);
  }
  .sub{
    color:var(--gold-soft);font-size:13px;letter-spacing:.25em;
    opacity:.85;margin-bottom:36px;
  }

  /* 月のビジュアル */
  .moon-stage{
    width:140px;height:140px;margin:8px auto 30px;
    position:relative;
  }
  .moon{
    width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fffdf2,#e9e4cf 55%,#b9b29a 100%);
    box-shadow:0 0 50px 8px rgba(243,226,175,.5),inset -14px -10px 30px rgba(0,0,0,.35);
    position:relative;overflow:hidden;
    animation:floaty 6s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  /* 月相を作る影 */
  .shadow{
    position:absolute;top:-5%;height:110%;width:110%;border-radius:50%;
    background:var(--ink2);
    transition:transform .6s ease, left .6s ease;
  }

  .card{
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(231,200,115,.35);
    border-radius:18px;
    padding:26px 22px;
    backdrop-filter:blur(4px);
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  label{display:block;text-align:left;margin:18px 0 8px;font-size:14px;letter-spacing:.08em;color:var(--gold-soft)}
  input[type=date],input[type=time],select{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(231,200,115,.4);
    background:rgba(10,10,31,.6);color:var(--text);font-size:16px;font-family:inherit;
  }
  select{appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--gold-soft) 50%),linear-gradient(135deg,var(--gold-soft) 50%,transparent 50%);
    background-position:calc(100% - 18px) 19px,calc(100% - 12px) 19px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{font-size:11px;color:#9c97c0;letter-spacing:0}
  button.auto{
    margin-top:18px;width:100%;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit;
    font-size:14px;letter-spacing:.08em;color:var(--gold-soft);
    background:rgba(231,200,115,.1);border:1px dashed rgba(231,200,115,.55);transition:all .2s;
  }
  button.auto:hover{background:rgba(231,200,115,.2)}
  .auto-result{font-size:13px;color:var(--gold-soft);margin-top:10px;min-height:0;text-align:center;letter-spacing:.03em}
  .auto-result.on{margin:12px 0 4px}
  .phase-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px;
  }
  .phase-btn{
    cursor:pointer;border:1px solid rgba(231,200,115,.3);border-radius:12px;
    background:rgba(255,255,255,.03);padding:12px 6px 9px;
    transition:all .25s;color:var(--text);
  }
  .phase-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
  .phase-btn.sel{border-color:var(--gold);background:rgba(231,200,115,.16);box-shadow:0 0 16px rgba(231,200,115,.4)}
  .phase-ico{
    width:42px;height:42px;border-radius:50%;margin:0 auto 7px;position:relative;overflow:hidden;
    background:radial-gradient(circle at 35% 30%,#fffdf2,#cfc8ad);
  }
  .phase-ico i{position:absolute;top:-10%;height:120%;width:120%;border-radius:50%;background:#0f0f28}
  .phase-name{font-size:11px;letter-spacing:.05em;line-height:1.3}

  button.cast{
    margin-top:28px;width:100%;padding:16px;border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:17px;letter-spacing:.18em;color:#1a1405;
    background:linear-gradient(90deg,#d9b65f,#f3e2af,#d9b65f);
    box-shadow:0 6px 24px rgba(231,200,115,.5);transition:transform .2s, filter .2s;
  }
  button.cast:hover{transform:translateY(-2px);filter:brightness(1.08)}
  button.cast:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}

  /* 演出オーバーレイ */
  #overlay{
    position:fixed;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(ellipse at 50% 50%,rgba(28,28,68,.9),rgba(5,5,18,.98));
    backdrop-filter:blur(2px);
  }
  #overlay.show{display:flex;animation:fadein .6s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .ritual-moon{
    width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fffdf2,#e9e4cf 55%,#b9b29a 100%);
    box-shadow:0 0 80px 20px rgba(243,226,175,.7);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 60px 12px rgba(243,226,175,.6)}50%{transform:scale(1.12);box-shadow:0 0 110px 30px rgba(243,226,175,.9)}}
  .ritual-text{margin-top:34px;font-size:18px;letter-spacing:.3em;color:var(--gold-soft);min-height:26px}
  .ring{
    position:absolute;border:1px solid rgba(231,200,115,.4);border-radius:50%;
    animation:expand 2.6s linear infinite;
  }
  @keyframes expand{from{width:120px;height:120px;opacity:.8}to{width:480px;height:480px;opacity:0}}

  /* 結果 */
  #result{margin-top:30px;display:none}
  #result.show{display:block;animation:rise 1s ease}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  .sign-title{font-size:24px;letter-spacing:.12em;color:var(--gold);text-shadow:0 0 14px rgba(231,200,115,.5);margin-bottom:4px}
  .sign-sub{font-size:13px;color:var(--gold-soft);letter-spacing:.2em;margin-bottom:18px;opacity:.85}
  .reading{text-align:left;line-height:2;font-size:15px}
  .reading h3{color:var(--gold-soft);font-size:14px;letter-spacing:.1em;margin:18px 0 4px;border-left:3px solid var(--gold);padding-left:10px}
  .keyword{display:inline-block;margin:4px 6px 0 0;padding:5px 12px;border:1px solid rgba(231,200,115,.4);border-radius:999px;font-size:12px;color:var(--gold-soft)}
  .again{margin-top:26px;background:none;border:1px solid rgba(231,200,115,.5);color:var(--gold-soft);
    padding:11px 26px;border-radius:999px;cursor:pointer;font-family:inherit;letter-spacing:.1em;font-size:13px}
  .again:hover{background:rgba(231,200,115,.12)}
  .note{font-size:11px;opacity:.5;margin-top:26px;letter-spacing:.05em;line-height:1.8}

  /* ===== LINE宣伝(PR)ブロック ===== */
  .promo{
    margin-top:24px;padding:20px 18px;border-radius:16px;text-align:center;
    background:linear-gradient(180deg,rgba(6,199,85,.16),rgba(6,199,85,.06));
    border:1px solid rgba(6,199,85,.5);
  }
  .promo .pt{font-size:15px;letter-spacing:.04em;line-height:1.7;color:#eafff0}
  .promo .ps{font-size:12px;color:#bfe9cc;margin-top:6px;line-height:1.7}
  .line-btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    padding:13px 26px;border-radius:999px;text-decoration:none;
    background:#06c755;color:#fff;font-weight:700;font-size:15px;letter-spacing:.05em;
    box-shadow:0 6px 20px rgba(6,199,85,.45);transition:transform .2s,filter .2s;
  }
  .line-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
  .line-ico{width:22px;height:22px;background:#fff;border-radius:6px;color:#06c755;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;font-family:Arial,sans-serif}

  /* ===== スマホ最適化 ===== */
  @media (max-width:480px){
    .wrap{padding:34px 14px 64px}
    h1{letter-spacing:.12em}
    .sub{letter-spacing:.12em;font-size:12px;margin-bottom:26px}
    .card{padding:20px 15px;border-radius:15px}
    .moon-stage{width:112px;height:112px;margin-bottom:22px}
    .phase-grid{gap:7px}
    .phase-btn{padding:9px 3px 7px;border-radius:10px}
    .phase-ico{width:34px;height:34px;margin-bottom:5px}
    .phase-name{font-size:10px;letter-spacing:0}
    button.cast{font-size:16px;letter-spacing:.12em;padding:15px}
    .reading{font-size:14.5px;line-height:1.95}
    .sign-title{font-size:21px}
    .ritual-text{font-size:15px;letter-spacing:.18em;padding:0 18px}
    .ring{animation-name:expandSm}
  }
  @keyframes expandSm{from{width:100px;height:100px;opacity:.8}to{width:300px;height:300px;opacity:0}}
  /* 小さめ端末で月相を2行に収める保険 */
  @media (max-width:340px){
    .phase-grid{grid-template-columns:repeat(4,1fr);gap:5px}
    .phase-name{font-size:9px}
  }
  /* 動きを減らす設定の人への配慮 */
  @media (prefers-reduced-motion:reduce){
    .moon,.ritual-moon,.star{animation:none}
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="stars2"></div>

<div class="wrap">
  <h1>月 の 占 い</h1>
  <div class="sub">― あなたの本当の心、月星座が語る ―</div>

  <div class="moon-stage"><div class="moon"><div class="shadow" id="bigShadow"></div></div></div>

  <div class="card" id="inputCard">
    <label for="bday">生まれた日（生年月日）</label>
    <input type="date" id="bday" min="1900-01-01" max="2099-12-31" value="2000-01-01">

    <div class="row2">
      <div>
        <label for="btime">生まれた時間 <span class="opt">（任意）</span></label>
        <input type="time" id="btime" value="12:00">
      </div>
      <div>
        <label for="bplace">生まれた場所</label>
        <select id="bplace"></select>
      </div>
    </div>

    <button class="auto" id="autoBtn" type="button">🌙 生まれた時の月の形を自動で調べる</button>
    <div class="auto-result" id="autoResult"></div>

    <label>生まれたときの月の形 <span class="opt">（自動判定 または 手動で選択）</span></label>
    <div class="phase-grid" id="phaseGrid"></div>

    <button class="cast" id="castBtn" disabled>月に問う</button>
  </div>

  <div id="result"></div>

  <div class="note">
    マドモアゼル愛先生の「月星座」の考え方を参考にした、エンターテインメント占いです。<br>
    月星座・月の満ち欠けは、生まれた日・時間・場所から概算で算出しています<br>
    （時間が不明な場合はお昼として計算します。境界の前後では多少ずれることがあります）。
  </div>
</div>

<div id="overlay">
  <div class="ring"></div><div class="ring" style="animation-delay:.8s"></div><div class="ring" style="animation-delay:1.6s"></div>
  <div class="ritual-moon"></div>
  <div class="ritual-text" id="ritualText"></div>
</div>

<script>
/* ============================================================
   ▼▼▼ マドモアゼル愛先生 LINE のURL（ここを差し替えてください）▼▼▼
   LINE公式アカウントの「友だち追加」URL（例: https://lin.ee/xxxxxxx）に変更すると
   結果画面の緑のボタンがそのアカウントにつながります。
   ============================================================ */
const LINE_URL = "https://lin.ee/your-line-id"; // ←ここを本物のURLに差し替え
const LINE_NAME = "マドモアゼル愛先生";

/* ========== 生まれた場所（タイムゾーン）========== */
/* 月の満ち欠けは「生まれた日時」で決まり、場所は時差(UTCとのズレ)の補正に使います */
const PLACES=[
  {n:'日本（東京・大阪など）',tz:9},
  {n:'韓国（ソウル）',tz:9},
  {n:'台湾（台北）',tz:8},
  {n:'中国（北京・上海）',tz:8},
  {n:'タイ（バンコク）',tz:7},
  {n:'ハワイ（ホノルル）',tz:-10},
  {n:'アメリカ西海岸（ロサンゼルス）',tz:-8},
  {n:'アメリカ東海岸（ニューヨーク）',tz:-5},
  {n:'イギリス（ロンドン）',tz:0},
  {n:'フランス・ドイツ（パリ・ベルリン）',tz:1},
  {n:'オーストラリア東部（シドニー）',tz:10},
];

/* ========== 星空生成 ========== */
function makeStars(id,count){
  const c=document.getElementById(id);
  for(let i=0;i<count;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    s.style.width=s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.setProperty('--dur',(Math.random()*4+2)+'s');
    s.style.animationDelay=(Math.random()*4)+'s';
    c.appendChild(s);
  }
}
makeStars('stars',90);makeStars('stars2',50);

/* ========== 月相データ（生まれたときの月の形） ========== */
/* offset:影の位置(0=満月 / ±で欠ける), 影の幅イメージ */
const PHASES=[
  {key:'new',     name:'新月',   shadow:0,   light:'はじまりと種まきの月'},
  {key:'waxc',    name:'三日月', shadow:62,  light:'芽生え・好奇心の月'},
  {key:'firstq',  name:'上弦の月', shadow:50, light:'決断と行動の月'},
  {key:'waxg',    name:'満ちゆく月', shadow:30, light:'成長と挑戦の月'},
  {key:'full',    name:'満月',   shadow:-200,light:'完成と感情があふれる月'},
  {key:'wang',    name:'欠けゆく月', shadow:-30,light:'成熟と共有の月'},
  {key:'lastq',   name:'下弦の月', shadow:-50,light:'手放しと内省の月'},
  {key:'wanc',    name:'有明の月', shadow:-62,light:'浄化と次への準備の月'},
];

const phaseGrid=document.getElementById('phaseGrid');
let selPhase=null;
PHASES.forEach((p,idx)=>{
  const b=document.createElement('div');b.className='phase-btn';b.dataset.idx=idx;
  // アイコンの影位置
  let shLeft;
  if(p.shadow<=-100) shLeft='150%';            // 満月：影を外へ
  else if(p.shadow===0) shLeft='-10%';         // 新月：影で覆う … 後で調整
  else shLeft=null;
  b.innerHTML=`<div class="phase-ico"><i style="left:${iconShadowLeft(p)}"></i></div><div class="phase-name">${p.name}</div>`;
  b.onclick=()=>selectPhase(idx,b);
  phaseGrid.appendChild(b);
});

function iconShadowLeft(p){
  // 新月=ほぼ全部影 / 満月=影なし / その間
  if(p.key==='new') return '8%';
  if(p.key==='full') return '160%';
  if(p.shadow>0) return (p.shadow-10)+'%';   // 満ちる側：右に影
  return (-110-p.shadow)+'%';                 // 欠ける側：左に影
}

function selectPhase(idx,el){
  selPhase=idx;
  document.querySelectorAll('.phase-btn').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
  // 大きな月にも反映
  const p=PHASES[idx];
  document.getElementById('bigShadow').style.left=iconShadowLeft(p);
  checkReady();
}

const bday=document.getElementById('bday');
const btime=document.getElementById('btime');
const bplace=document.getElementById('bplace');
const castBtn=document.getElementById('castBtn');
const autoBtn=document.getElementById('autoBtn');
const autoResult=document.getElementById('autoResult');

// 場所の選択肢を生成
PLACES.forEach((pl,idx)=>{
  const o=document.createElement('option');o.value=idx;o.textContent=pl.n;bplace.appendChild(o);
});
bplace.value=0; // 既定: 日本

bday.addEventListener('change',checkReady);
function checkReady(){castBtn.disabled=!(bday.value && selPhase!==null);}

// 生まれた時の月の形を自動判定
autoBtn.addEventListener('click',()=>{
  if(!bday.value){autoResult.className='auto-result on';autoResult.textContent='先に「生まれた日」を入力してください。';return;}
  const tz=PLACES[+bplace.value].tz;
  const dayNum=dayNumFromInputs(bday.value,btime.value,tz);
  const phaseIdx=moonPhaseFromDayNum(dayNum);
  // グリッドの該当ボタンを選択
  const el=phaseGrid.querySelector(`[data-idx="${phaseIdx}"]`);
  selectPhase(phaseIdx,el);
  autoResult.className='auto-result on';
  const t=btime.value?`${btime.value}頃`:'時間未入力';
  autoResult.innerHTML=`✨ あなたが生まれた夜の月は <b style="color:#fff">「${PHASES[phaseIdx].name}」</b> でした<br><span style="opacity:.75;font-size:12px">（${bday.value} ${t} / ${PLACES[+bplace.value].n.replace(/（.*）/,'')}）</span>`;
});

/* ========== 太陽・月の黄経の概算計算 ========== */
/* Paul Schlyter の簡易式 + 主要摂動項 */
const RAD=Math.PI/180, rev=x=>((x%360)+360)%360;

/* 入力(日付・時間・場所のタイムゾーン)から元期2000 Jan 0.0(UT)基準の日数を得る */
function dayNumFromInputs(dateStr,timeStr,tz){
  const [y,mo,da]=dateStr.split('-').map(Number);
  const [hh,mi]=(timeStr||'12:00').split(':').map(Number);
  const utcMs=Date.UTC(y,mo-1,da,hh,mi)-tz*3600000; // 現地時刻→UTCへ
  return utcMs/86400000 - 10956.0;
}

/* 太陽の黄経 */
function sunLongitude(dayNum){
  const w=282.9404+4.70935e-5*dayNum;
  const e=0.016709-1.151e-9*dayNum;
  const M=rev(356.0470+0.9856002585*dayNum);
  let E=M+(180/Math.PI)*e*Math.sin(M*RAD)*(1+e*Math.cos(M*RAD));
  const xv=Math.cos(E*RAD)-e, yv=Math.sqrt(1-e*e)*Math.sin(E*RAD);
  const v=rev((180/Math.PI)*Math.atan2(yv,xv));
  return rev(v+w);
}

/* 月の黄経 */
function moonLongitude(dayNum){
  let N=rev(125.1228-0.0529538083*dayNum);
  const i=5.1454;
  const w=318.0634+0.1643573223*dayNum;
  let M=rev(115.3654+13.0649929509*dayNum);
  const e=0.054900,a=60.2666;
  let Ms=rev(356.0470+0.9856002585*dayNum);
  const ws=282.9404+4.70935e-5*dayNum;
  let E=M+(180/Math.PI)*e*Math.sin(M*RAD)*(1+e*Math.cos(M*RAD));
  for(let k=0;k<6;k++){
    E=E-(E-(180/Math.PI)*e*Math.sin(E*RAD)-M)/(1-e*Math.cos(E*RAD));
  }
  const xv=a*(Math.cos(E*RAD)-e);
  const yv=a*Math.sqrt(1-e*e)*Math.sin(E*RAD);
  const v=rev((180/Math.PI)*Math.atan2(yv,xv));
  const r=Math.sqrt(xv*xv+yv*yv);
  const xh=r*(Math.cos(N*RAD)*Math.cos((v+w)*RAD)-Math.sin(N*RAD)*Math.sin((v+w)*RAD)*Math.cos(i*RAD));
  const yh=r*(Math.sin(N*RAD)*Math.cos((v+w)*RAD)+Math.cos(N*RAD)*Math.sin((v+w)*RAD)*Math.cos(i*RAD));
  let lon=rev((180/Math.PI)*Math.atan2(yh,xh));
  const Lm=rev(N+w+M), Ls=rev(Ms+ws), Dm=rev(Lm-Ls), F=rev(Lm-N);
  lon+= -1.274*Math.sin((M-2*Dm)*RAD)
        +0.658*Math.sin(2*Dm*RAD)
        -0.186*Math.sin(Ms*RAD)
        -0.059*Math.sin((2*M-2*Dm)*RAD)
        -0.057*Math.sin((M-2*Dm+Ms)*RAD)
        +0.053*Math.sin((M+2*Dm)*RAD)
        +0.046*Math.sin((2*Dm-Ms)*RAD)
        +0.041*Math.sin((M-Ms)*RAD)
        -0.035*Math.sin(Dm*RAD)
        -0.031*Math.sin((M+Ms)*RAD)
        -0.015*Math.sin((2*F-2*Dm)*RAD)
        +0.011*Math.sin((M-4*Dm)*RAD);
  return rev(lon);
}

/* 月星座(0..11) */
function moonSignFromDayNum(dayNum){ return Math.floor(moonLongitude(dayNum)/30); }

/* 月相(0..7)を月と太陽の離角から判定。PHASES配列の並びに対応 */
function moonPhaseFromDayNum(dayNum){
  const D=rev(moonLongitude(dayNum)-sunLongitude(dayNum)); // 0=新月,90=上弦,180=満月,270=下弦
  return Math.floor((rev(D+22.5))/45); // 0..7
}
